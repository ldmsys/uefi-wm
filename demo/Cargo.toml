[package]
name    = "uefi-gui-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "uefi-gui"
path = "src/main.rs"
doc  = false

[dependencies]
uefi-wm = { path = ".." }
uefi     = { version = "0.33", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.9"
log      = { version = "0.4", default-features = false }
