[workspace]
members  = ["demo"]
default-members = [".", "demo"]
resolver = "2"

[package]
name        = "uefi-wm"
version     = "0.1.0"
edition     = "2021"
description = "A tiny no_std window manager for UEFI graphics environments"
license     = "MIT"
homepage    = "https://github.com/ldmsys/uefi-wm.git"
repository  = "https://github.com/ldmsys/uefi-wm.git"
readme      = "README.md"
exclude     = ["/demo", "AGENTS.md"]

[lib]
name = "uefi_wm"
path = "src/lib.rs"

[dependencies]
# Only the base alloc feature — panic_handler / global_allocator / logger are
# the binary's responsibility and must not be registered twice.
uefi     = { version = "0.33", features = ["alloc"] }
uefi-raw = "0.9"
fontdue  = { version = "0.9.3", default-features = false, features = ["hashbrown"] }

[profile.release]
opt-level = "s"
panic     = "abort"
strip     = true

[profile.dev]
panic = "abort"
